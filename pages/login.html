<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Nexus TI</title>

  <link rel="stylesheet" href="../css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    .auth-page {
      background:
        radial-gradient(ellipse at 20% 20%, rgba(0,212,255,0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(124,58,237,0.06) 0%, transparent 50%),
        var(--cor-primaria);
    }

    #form-auth {
      animation: slideUp 0.5s ease;
    }

    .auth-bg-dots {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: radial-gradient(rgba(0,212,255,0.08) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>

<body class="auth-page">
  <div class="auth-bg-dots" aria-hidden="true"></div>

  <div style="position:relative; z-index:1; width:100%; max-width:460px; padding:2rem;">

    <form id="form-auth" novalidate aria-label="Formulário de login">

      <div class="auth-logo">
        <a href="../index.html" class="logo" style="justify-content:center; margin-bottom:0.5rem;">
          <div class="logo-icone">NX</div>
          <span class="logo-texto">Nexus<span>TI</span></span>
        </a>
        <h1 class="auth-titulo">Bem-vindo de volta</h1>
        <p class="auth-subtitulo">Acesse sua conta para continuar</p>
      </div>

      <div class="form-grupo" id="grupo-email">
        <label for="email">E-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="seu@email.com"
          autocomplete="email"
          aria-required="true"
          aria-describedby="erro-email" />
        <span class="erro-msg" id="erro-email" role="alert"></span>
      </div>

      <div class="form-grupo" id="grupo-senha">
        <label for="senha">Senha</label>
        <input
          type="password"
          id="senha"
          name="senha"
          placeholder="••••••••"
          autocomplete="current-password"
          aria-required="true"
          aria-describedby="erro-senha" />
        <span class="erro-msg" id="erro-senha" role="alert"></span>
      </div>

      <div class="auth-botoes">
        <button type="submit" class="btn btn-primario" id="btn-login">Entrar</button>
        <button type="button" class="btn btn-secundario" id="btn-limpar">Limpar</button>
      </div>

      <div class="auth-links">
        <a href="troca-senha.html">Esqueci minha senha</a>
        <a href="cadastro.html">Criar conta</a>
      </div>

    </form>
  </div>

  <script src="../js/utils.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
