<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro — Nexus TI</title>

  <link rel="stylesheet" href="../css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    .cadastro-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 1.5rem;
    }

    .cadastro-grid .form-grupo-full {
      grid-column: 1 / -1;
    }

    @media (max-width: 600px) {
      .cadastro-grid {
        grid-template-columns: 1fr;
      }
    }

    #form-auth {
      max-width: 600px;
    }
  </style>
</head>

<body class="auth-page" style="align-items: flex-start; padding: 3rem 1rem;">

  <div style="width:100%; max-width:620px; position:relative; z-index:1;">

    <form id="form-auth" novalidate aria-label="Formulário de cadastro de cliente">

      <div class="auth-logo">
        <a href="../index.html" class="logo" style="justify-content:center; margin-bottom:0.5rem;">
          <div class="logo-icone">NX</div>
          <span class="logo-texto">Nexus<span>TI</span></span>
        </a>
        <h1 class="auth-titulo">Criar conta</h1>
        <p class="auth-subtitulo">Preencha os dados para acessar nosso portal de serviços.</p>
      </div>

      <div class="cadastro-grid">

        <div class="form-grupo form-grupo-full" id="grupo-email">
          <label for="email">E-mail <abbr title="obrigatório">*</abbr></label>
          <input type="email" id="email" name="email" placeholder="seu@email.com"
                 autocomplete="email" aria-required="true" aria-describedby="erro-email" />
          <span class="erro-msg" id="erro-email" role="alert"></span>
        </div>

        <div class="form-grupo" id="grupo-senha">
          <label for="senha">Senha <abbr title="obrigatório">*</abbr></label>
          <input type="password" id="senha" name="senha" placeholder="••••••••"
                 autocomplete="new-password" aria-required="true" aria-describedby="erro-senha dica-senha" />
          <small id="dica-senha" style="font-size:0.75rem; color:var(--cor-texto-suave); display:block; margin-top:4px;">
            Mín. 6 chars · número · maiúscula · especial
          </small>
          <span class="erro-msg" id="erro-senha" role="alert"></span>
        </div>

        <div class="form-grupo" id="grupo-confirmar">
          <label for="confirmar">Confirmar senha <abbr title="obrigatório">*</abbr></label>
          <input type="password" id="confirmar" name="confirmar" placeholder="••••••••"
                 autocomplete="new-password" aria-required="true" aria-describedby="erro-confirmar" />
          <span class="erro-msg" id="erro-confirmar" role="alert"></span>
        </div>

        <div class="form-grupo form-grupo-full" id="grupo-nome">
          <label for="nome">Nome completo <abbr title="obrigatório">*</abbr></label>
          <input type="text" id="nome" name="nome" placeholder="Seu Nome Sobrenome"
                 autocomplete="name" aria-required="true" aria-describedby="erro-nome" />
          <span class="erro-msg" id="erro-nome" role="alert"></span>
        </div>

        <div class="form-grupo" id="grupo-cpf">
          <label for="cpf">CPF <abbr title="obrigatório">*</abbr></label>
          <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00"
                 maxlength="14" inputmode="numeric" aria-required="true" aria-describedby="erro-cpf" />
          <span class="erro-msg" id="erro-cpf" role="alert"></span>
        </div>

        <div class="form-grupo" id="grupo-nascimento">
          <label for="nascimento">Data de nascimento <abbr title="obrigatório">*</abbr></label>
          <input type="date" id="nascimento" name="nascimento"
                 aria-required="true" aria-describedby="erro-nascimento" />
          <span class="erro-msg" id="erro-nascimento" role="alert"></span>
        </div>

        <div class="form-grupo form-grupo-full" id="grupo-telefone">
          <label for="telefone">Telefone <span style="color:var(--cor-texto-suave); font-weight:400;">(opcional)</span></label>
          <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999"
                 maxlength="15" autocomplete="tel" aria-describedby="erro-telefone" />
          <span class="erro-msg" id="erro-telefone" role="alert"></span>
        </div>

        <div class="form-grupo form-grupo-full" id="grupo-estado-civil">
          <label>Estado civil <abbr title="obrigatório">*</abbr></label>
          <div class="radio-grupo" role="radiogroup" aria-label="Estado civil">
            <label class="radio-item">
              <input type="radio" name="estado_civil" value="solteiro" checked /> Solteiro(a)
            </label>
            <label class="radio-item">
              <input type="radio" name="estado_civil" value="casado" /> Casado(a)
            </label>
            <label class="radio-item">
              <input type="radio" name="estado_civil" value="divorciado" /> Divorciado(a)
            </label>
            <label class="radio-item">
              <input type="radio" name="estado_civil" value="viuvo" /> Viúvo(a)
            </label>
          </div>
          <span class="erro-msg" id="erro-estado-civil" role="alert"></span>
        </div>

        <div class="form-grupo form-grupo-full" id="grupo-escolaridade">
          <label for="escolaridade">Escolaridade <abbr title="obrigatório">*</abbr></label>
          <select id="escolaridade" name="escolaridade" aria-required="true" aria-describedby="erro-escolaridade">
            <option value="">Selecione...</option>
            <option value="fundamental_inc">Fundamental incompleto</option>
            <option value="fundamental_com">Fundamental completo</option>
            <option value="medio_inc">2º grau incompleto</option>
            <option value="medio_com" selected>2º grau completo</option>
            <option value="superior_inc">Superior incompleto</option>
            <option value="superior_com">Superior completo</option>
            <option value="pos">Pós-graduação / MBA</option>
            <option value="mestrado">Mestrado</option>
            <option value="doutorado">Doutorado</option>
          </select>
          <span class="erro-msg" id="erro-escolaridade" role="alert"></span>
        </div>

      </div>

      <div style="display:flex; gap:1rem; margin-top:0.5rem; flex-wrap:wrap;">
        <button type="submit" class="btn btn-primario" id="btn-incluir" style="flex:1; justify-content:center;">
          Criar conta
        </button>
        <button type="button" class="btn btn-secundario" id="btn-limpar">Limpar</button>
        <button type="button" class="btn btn-secundario" id="btn-voltar">← Voltar</button>
      </div>

      <div class="auth-links" style="justify-content:center; margin-top:1.5rem;">
        <span style="color:var(--cor-texto-suave);">Já tem conta?</span>
        <a href="login.html">Fazer login</a>
      </div>

    </form>
  </div>

  <script src="../js/utils.js"></script>
  <script src="../js/cadastro.js"></script>
</body>
</html>
